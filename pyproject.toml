[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebook"
dynamic = ["version"]
description = "Desktop trading-card scanner: webcam capture, MobileNetV2 matching, CSV export for Dreamborn.ink."
readme = "README.md"
requires-python = ">=3.11"
# Base install is the shared, lightweight core (matching, CSV, hardware
# abstraction). Pick an extra for the runtime:
#   desktop GUI:  pip install -e .[gui]      (or: pip install -r requirements.txt)
#   Pi sorter:    pip install .[sorter]      (tflite-runtime, no TensorFlow/Qt)
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.11",
]

[project.scripts]
lorebook = "lorebook.cli:main"
lorebook-ui = "lorebook.ui.app:main"
lorebook-sort = "lorebook.sorter.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.15", "mypy>=2"]  # exact CI pins: requirements-dev.txt
# Desktop GUI + onnx feature backend (default; onnx/h5py build the model
# from the Keras weights) + keras backend (fallback; builds the .tflite model).
gui = [
    "onnxruntime>=1.20",
    "onnx>=1.17",
    "h5py>=3.10",
    "tensorflow>=2.18,<2.19",
    "keras>=3.9,<4",
    "scikit-learn>=1.6",
    "PySide6>=6.8,<6.9",  # NumPy-2-safe LTS line; see requirements.txt
]
# Raspberry Pi sorter runtime: lightweight tflite inference without
# TensorFlow or Qt. Install with `pip install .[sorter]` on the Pi.
# A live USB camera works through opencv-python today; `picamera2` would be
# added here when a CSI ribbon camera backend lands.
sorter = ["tflite-runtime"]

[tool.setuptools]
# Root-level run_ui.py is a runnable script (the PyInstaller entry), not part of
# the installable package; only the lorebook package is packaged.
packages = [
    "lorebook",
    "lorebook.core",
    "lorebook.core.features",
    "lorebook.ui",
    "lorebook.hardware",
    "lorebook.sorter",
]

[tool.setuptools.dynamic]
version = {attr = "lorebook.__version__"}

[tool.setuptools.package-data]
"lorebook.ui" = ["assets/*"]

[tool.mypy]
python_version = "3.11"
files = ["lorebook"]
# TensorFlow/tflite/onnx aren't installed in CI (tests stub them); treat their
# imports as untyped rather than failing. PySide6 is installed for the type
# check (the gui job), so lorebook/ui is checked against its real types.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Default E4/E7/E9 + F (pyflakes): catches unused imports/variables and
# undefined names — the only automated net over the Qt code CI can't run.
# UP: modern syntax for the py311 target; G: lazy %-style logging args
# (no f-strings in log calls); I: sorted imports; BLE: no blind
# `except Exception` — catch what can actually happen, or mark a real
# boundary (worker thread, Qt callback, per-item batch loop, CLI top level)
# with `# noqa: BLE001` and a reason. N: PEP 8 names. C901/PLR09xx: keep
# functions small enough to do one thing (complexity, branches, arguments,
# statements) — split a function rather than raise a limit.
select = ["E4", "E7", "E9", "F", "UP", "G", "I", "BLE", "N", "C901", "PLR0912", "PLR0913", "PLR0915", "D1"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Six leaves room for a constructor's injected collaborators plus a config object.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Qt event handlers and OpenCV stand-ins override camelCase methods.
"lorebook/ui/*.py" = ["N802"]
"tests/test_camera.py" = ["N802"]
# One test walks a whole scenario step by step; length is not complexity there.
"tests/*.py" = ["PLR0915", "D1"]
# The hook is a tiny standalone script.
".claude/hooks/*.py" = ["D1"]
# TF env vars and warning filters must be set before the imports they affect.
"lorebook/core/features/__init__.py" = ["E402"]
