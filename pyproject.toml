[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebook"
version = "0.1.0"
description = "Desktop trading-card scanner: webcam capture, MobileNetV2 matching, CSV export for Dreamborn.ink."
readme = "README.md"
requires-python = ">=3.11"
# Base install is the shared, lightweight core (matching, CSV, hardware
# abstraction). Pick an extra for the runtime:
#   desktop GUI:  pip install -e .[gui]      (or: pip install -r requirements.txt)
#   Pi sorter:    pip install .[sorter]      (tflite-runtime, no TensorFlow/Qt)
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
]

[project.scripts]
lorebook-ui = "lorebook.ui.app:main"
lorebook-sort = "lorebook.sorter.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]
# Desktop GUI + keras feature backend (also builds the .tflite model).
gui = [
    "tensorflow",
    "keras",
    "scikit-learn",
    "PySide6>=6.8,<6.9",  # NumPy-2-safe LTS line; see requirements.txt
]
# Raspberry Pi sorter runtime: lightweight tflite inference without
# TensorFlow or Qt. Install with `pip install .[sorter]` on the Pi.
# A live USB camera works through opencv-python today; `picamera2` would be
# added here when a CSI ribbon camera backend lands.
sorter = ["tflite-runtime"]

[tool.setuptools]
# Root-level UI.py / PhotoMatching.py are runnable scripts, not part of the
# installable package; only the lorebook package is packaged.
packages = [
    "lorebook",
    "lorebook.core",
    "lorebook.ui",
    "lorebook.hardware",
    "lorebook.sorter",
]

[tool.mypy]
python_version = "3.11"
files = ["lorebook"]
# TensorFlow/tflite/PySide6 aren't installed in CI (tests stub them);
# treat their imports as untyped rather than failing.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Default E4/E7/E9 + F (pyflakes): catches unused imports/variables and
# undefined names — the only automated net over the Qt code CI can't run.
# UP: modern syntax for the py311 target; G: lazy %-style logging args
# (no f-strings in log calls); I: sorted imports; BLE: no blind
# `except Exception` — catch what can actually happen, or mark a real
# boundary (worker thread, Qt callback, per-item batch loop, CLI top level)
# with `# noqa: BLE001` and a reason.
select = ["E4", "E7", "E9", "F", "UP", "G", "I", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Backward-compat re-export shim: every import IS the public API.
"PhotoMatching.py" = ["F401"]
# TF env vars and warning filters must be set before the imports they affect.
"lorebook/core/features.py" = ["E402"]
