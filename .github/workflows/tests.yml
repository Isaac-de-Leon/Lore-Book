name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite stubs TensorFlow/Keras (tests/conftest.py) and sklearn is
      # optional in lorebook.core.matching, so only the light deps are needed.
      - name: Install test dependencies
        run: pip install pytest numpy opencv-python-headless

      - name: Run tests
        run: python -m pytest tests/ -v
