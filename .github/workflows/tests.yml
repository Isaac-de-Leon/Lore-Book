name: Tests

on:
  push:
  pull_request:

# Light CI: the suite stubs TensorFlow/Keras (tests/conftest.py) and sklearn
# is optional in lorebook.core.matching, so jobs install the pinned dev tools
# plus numpy/opencv at the versions requirements.txt locks.
env:
  LIGHT_DEPS: -r requirements-dev.txt numpy==2.0.2 opencv-python-headless==4.11.0.86

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ${{ env.LIGHT_DEPS }}
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  test:
    # Windows is where the app is actually used; Linux covers the Pi sorter.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ${{ env.LIGHT_DEPS }}
      - name: Run tests
        run: python -m pytest tests/ -v

  gui:
    # The whole suite with the desktop packages installed, so the headless Qt
    # tests and the ONNX tests run (they skip in the job above, which installs
    # neither), with coverage enforced (fail_under in pyproject.toml). Windows
    # is where the app is used. The type check needs PySide6 too: without it
    # every Qt type is Any and lorebook/ui goes unchecked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install ${{ env.LIGHT_DEPS }} PySide6==6.8.3 onnxruntime==1.31.0 onnx==1.17.0 h5py==3.13.0
      - name: Type check
        if: runner.os == 'Linux'
        run: mypy
      - name: Full suite with coverage
        run: python -m pytest tests/ -v --cov
